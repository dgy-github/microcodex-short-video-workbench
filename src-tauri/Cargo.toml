[package]
name = "microcodex-short-video-workbench"
version = "0.1.0-alpha.5"
edition = "2021"
rust-version = "1.96"
license = "MIT"

[workspace]

[lib]
name = "microcodex_short_video_workbench"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "=2.4.0", default-features = false, features = [] }

[dependencies]
tauri = { version = "=2.8.0", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "=2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ncx-video-agent = { path = "../vendor/rust/crates/ncx-video-agent" }

[profile.release]
strip = false
lto = false
opt-level = "s"
codegen-units = 16
